# Optional override: put private values in ./secrets/*.txt instead of .env.
services:
  agent:
    environment:
      VISA_API_KEY: ""
      DEEPSEEK_API_KEY: ""
      VISA_QQ_AUTH_CODE: ""
      VISA_API_KEY_FILE: /run/secrets/model_key
      VISA_QQ_AUTH_CODE_FILE: /run/secrets/qq_code
    secrets:
      - model_key
      - qq_code
secrets:
  model_key:
    file: ./secrets/model_key.txt
  qq_code:
    file: ./secrets/qq_code.txt
