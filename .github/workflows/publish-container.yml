name: publish-container
on:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  publish:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Compute registry name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Build and verify the image before publication
        run: |
          docker build --target runtime --build-arg VCS_REF=${GITHUB_SHA} -t visa-agent:publish .
          docker run --rm --read-only --tmpfs /tmp:rw,size=1g visa-agent:publish python scripts/container_smoke.py
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish latest and immutable commit tags
        env:
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          docker tag visa-agent:publish "$IMAGE:latest"
          docker tag visa-agent:publish "$IMAGE:sha-$GITHUB_SHA"
          docker push "$IMAGE:latest"
          docker push "$IMAGE:sha-$GITHUB_SHA"
