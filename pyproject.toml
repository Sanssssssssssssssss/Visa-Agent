[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "visa-case-agent"
version = "0.1.0"
description = "An inspectable, event-driven UK visa material preparation demo"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic-ai-slim[openai]>=2.54,<3",
  "httpx2>=2.13,<3",
  "pypdf>=6",
  "pypdfium2>=5",
  "rapidocr>=3",
  "onnxruntime>=1.22",
  "Pillow>=11",
  "reportlab>=4",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=1", "ruff>=0.12"]

[project.scripts]
visa-agent = "visa_agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/visa_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
